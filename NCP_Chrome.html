<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>NCP System</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f0f2f7;font-size:14px;color:#1a1a1a}
/* LOGIN */
#pgL{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a3a6b,#2563a8)}
#pgA{display:none;flex-direction:column;min-height:100vh}
.lbox{background:#fff;border-radius:18px;padding:30px;width:285px;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.3)}
.dots{display:flex;justify-content:center;gap:11px;margin:13px 0}
.dot{width:13px;height:13px;border-radius:50%;background:#e0e0e0}
.dot.on{background:#1a3a6b}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:4px}
.lk{padding:13px 0;font-size:18px;font-weight:600;border:1.5px solid #e0e0e0;border-radius:9px;cursor:pointer;background:#fff;font-family:inherit}
.lk:active{background:#f0f2f7}
.lk.ok{background:#1a3a6b;color:#fff;border-color:#1a3a6b}
.lerr{background:#ffebee;color:#c62828;font-size:12px;padding:7px;border-radius:7px;margin-bottom:8px;display:none}
/* TOPBAR */
.topbar{background:#1a3a6b;color:#fff;display:flex;align-items:center;gap:7px;padding:0 11px;height:46px;position:sticky;top:0;z-index:100;flex-shrink:0}
.tlogo{width:26px;height:26px;background:#2563a8;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0}
.tnav{display:flex;gap:1px;overflow-x:auto;flex:1;scrollbar-width:none}
.tnav::-webkit-scrollbar{display:none}
.nb{background:none;border:none;color:rgba(255,255,255,.6);padding:5px 8px;border-radius:5px;cursor:pointer;font-size:11px;white-space:nowrap;font-family:inherit}
.nb.on,.nb:hover{background:rgba(255,255,255,.18);color:#fff;font-weight:600}
.uav{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0}
.lout{background:none;border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.8);border-radius:5px;padding:3px 7px;cursor:pointer;font-size:10px;font-family:inherit}
/* MAIN */
.main{max-width:1040px;margin:0 auto;padding:11px;width:100%}
.sec{display:none}.sec.on{display:block}
/* CARDS */
.card{background:#fff;border:1px solid #e4e4e4;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:6px;flex-wrap:wrap}
.ct{font-size:13px;font-weight:600}
/* GRID */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
/* METRIC */
.met{border-radius:8px;padding:10px 12px}
.mb{background:#e8f0fb;border-left:3px solid #2563a8}
.mg{background:#e8f5e9;border-left:3px solid #2e7d32}
.mr{background:#ffebee;border-left:3px solid #c62828}
.ma{background:#fff3e0;border-left:3px solid #e65100}
.mn{background:#f8f9fc;border:1px solid #e0e0e0}
.ml{font-size:10px;color:#888;margin-bottom:2px}
.mv{font-size:20px;font-weight:700}
.ms{font-size:10px;color:#aaa;margin-top:1px}
/* BUTTON */
.btn{display:inline-flex;align-items:center;gap:3px;padding:5px 11px;border-radius:6px;border:1px solid #e0e0e0;background:#fff;color:#333;cursor:pointer;font-size:11px;font-family:inherit;font-weight:500;white-space:nowrap}
.btn:hover{background:#f5f5f5}
.bp{background:#2563a8;color:#fff;border-color:#2563a8}.bp:hover{background:#1a4a8a}
.bg{background:#2e7d32;color:#fff;border-color:#2e7d32}
.br{background:#c62828;color:#fff;border-color:#c62828}
.bs{padding:3px 9px;font-size:10px}
.bx{padding:2px 6px;font-size:9px}
/* BADGE */
.bdg{display:inline-block;font-size:9px;font-weight:600;padding:2px 6px;border-radius:20px;white-space:nowrap}
.bgg{background:#e8f5e9;color:#2e7d32}
.bbl{background:#e8f0fb;color:#2563a8}
.bag{background:#fff3e0;color:#e65100}
.brd{background:#ffebee;color:#c62828}
.bgr{background:#f0f0f0;color:#666}
/* ALERT */
.al{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:7px;margin-bottom:5px;cursor:pointer}
.alr{background:#ffebee;border-left:3px solid #c62828}
.ala{background:#fff3e0;border-left:3px solid #e65100}
.alb{background:#e8f0fb;border-left:3px solid #2563a8}
.aic{font-size:13px;flex-shrink:0}.at{font-weight:600;font-size:11px;margin-bottom:1px}.as{font-size:10px;color:#666}
/* TABS */
.tabs{display:flex;gap:3px;margin-bottom:10px;flex-wrap:wrap}
.tab{padding:4px 9px;border-radius:6px;border:1px solid #e0e0e0;background:#fff;color:#666;cursor:pointer;font-size:10px;font-family:inherit}
.tab.on{background:#2563a8;color:#fff;border-color:#2563a8}
/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:11px}
.tbl th{padding:6px 7px;text-align:left;font-size:10px;font-weight:600;color:#888;border-bottom:2px solid #e0e0e0;background:#f8f9fc;white-space:nowrap}
.tbl td{padding:6px 7px;border-bottom:1px solid #f5f5f5;vertical-align:top}
.tw{overflow-x:auto}
/* ROW */
.row{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid #f5f5f5}
.row:last-child{border-bottom:none}
.rt{font-size:12px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs{font-size:10px;color:#888;margin-top:1px}
/* PROGRESS */
.pb{height:2px;background:#eee;border-radius:2px;margin-top:3px}
.pf{height:2px;border-radius:2px;background:#2563a8}
/* NOTICE */
.nt{border-radius:7px;padding:7px 11px;margin-bottom:9px;font-size:12px;line-height:1.5}
.ntb{background:#e8f0fb;color:#1a5c9e;border-left:3px solid #2563a8}
.ntg{background:#e8f5e9;color:#1b5e20;border-left:3px solid #2e7d32}
.nta{background:#fff3e0;color:#bf360c;border-left:3px solid #e65100}
/* OVERLAY */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-start;justify-content:center;padding:36px 11px 11px;overflow-y:auto}
.ov.on{display:flex}
.obox{background:#fff;border-radius:12px;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;box-shadow:0 14px 44px rgba(0,0,0,.3)}
.ohd{background:#1a3a6b;color:#fff;padding:14px 16px;border-radius:12px 12px 0 0;position:sticky;top:0}
.oht{font-size:13px;font-weight:700;margin-bottom:2px}.ohs{font-size:10px;opacity:.75}
.ocl{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.2);border:none;color:#fff;width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:13px;font-family:inherit}
.obd{padding:13px 16px}
.otabs{display:flex;gap:2px;padding:6px 16px 0;background:#f8f9fc;border-bottom:1px solid #e0e0e0;flex-wrap:wrap}
.otab{padding:5px 10px;border-radius:5px 5px 0 0;border:1px solid transparent;background:none;color:#888;cursor:pointer;font-size:10px;font-family:inherit;margin-bottom:-1px}
.otab.on{background:#fff;border-color:#e0e0e0;border-bottom-color:#fff;color:#2563a8;font-weight:600}
.ocon{display:none;padding:12px 16px}.ocon.on{display:block}
/* LOG */
.lge{display:flex;gap:7px;padding:5px 0;border-bottom:1px solid #f5f5f5}
.lgd{width:6px;height:6px;border-radius:50%;background:#2563a8;flex-shrink:0;margin-top:3px}
.lgm{font-size:10px;color:#888;margin-top:1px}
/* SUBS */
.sc{background:#f8f9fc;border:1px solid #e0e0e0;border-radius:7px;padding:7px 10px;margin-bottom:5px;display:flex;align-items:center;gap:7px;cursor:pointer}
.sc:hover,.sc.on{border-color:#2563a8;background:#e8f0fb}
/* FIELD */
.fwrap{max-width:380px;margin:0 auto}
.fhd{background:#1a3a6b;color:#fff;border-radius:10px;padding:14px;margin-bottom:9px}
.abox{background:#fff;border:2px solid #e65100;border-radius:10px;padding:13px;margin-bottom:9px}
/* ADMIN */
.adwrap{display:flex;min-height:calc(100vh - 46px)}
.adnav{background:#1a3a6b;min-width:155px;padding:9px 0;display:flex;flex-direction:column;flex-shrink:0}
.adni{display:flex;align-items:center;gap:7px;padding:7px 13px;color:rgba(255,255,255,.65);cursor:pointer;font-size:11px;border-left:3px solid transparent}
.adni:hover,.adni.on{background:rgba(255,255,255,.1);color:#fff;border-left-color:#fff}
.adm{flex:1;padding:14px;overflow-y:auto}
/* HOWTO/TRAINING */
.hti{background:#fff;border:1px solid #e0e0e0;border-radius:7px;margin-bottom:5px;overflow:hidden}
.hth{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;cursor:pointer;font-weight:600;font-size:11px}
.hth:hover{background:#f8f9fc}
.htb{display:none;padding:10px 12px;border-top:1px solid #e0e0e0;font-size:11px;color:#555;line-height:1.7}.htb.on{display:block}
.hts{display:flex;gap:7px;margin-bottom:7px;align-items:flex-start}
.htn{width:19px;height:19px;border-radius:50%;background:#2563a8;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.mc{background:#fff;border:1px solid #e0e0e0;border-radius:9px;padding:11px;margin-bottom:7px;cursor:pointer;display:flex;align-items:flex-start;gap:10px}
.mc:hover{border-color:#2563a8}
.mic{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
/* PHASE */
.phrow{display:flex;align-items:flex-start;margin:6px 0;overflow-x:auto;padding-bottom:2px}
.phu{display:flex;flex-shrink:0;align-items:flex-start}
.phn{display:flex;flex-direction:column;align-items:center}
.phl{width:16px;height:2px;margin-top:8px;flex-shrink:0}
.phd{width:18px;height:18px;border-radius:50%;border:2px solid #ddd;background:#fff;display:flex;align-items:center;justify-content:center;font-size:7px;cursor:pointer;font-weight:700}
.phd.dn{background:#2e7d32;border-color:#2e7d32;color:#fff}
.phd.ac{background:#2563a8;border-color:#2563a8;color:#fff}
.phlb{font-size:7px;color:#ccc;margin-top:1px;text-align:center;white-space:nowrap;font-weight:600}
.phlb.dn{color:#2e7d32}.phlb.ac{color:#2563a8}
.pchip{border-radius:4px;padding:2px 6px;font-size:9px;display:inline-flex;align-items:center;gap:3px;margin-right:3px;margin-bottom:3px;cursor:pointer}
/* FORMS */
.fi{margin-bottom:7px}
.fi label{font-size:10px;color:#888;display:block;margin-bottom:2px;font-weight:500}
input,select,textarea{width:100%;font-family:inherit;font-size:12px;padding:6px 8px;border-radius:6px;border:1.5px solid #e0e0e0;color:#1a1a1a;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:#2563a8}
textarea{resize:vertical;min-height:55px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* MISC */
.hr{border:none;border-top:1px solid #e0e0e0;margin:9px 0}
.sect{font-size:9px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.5px;margin:10px 0 5px}
.empty{color:#aaa;font-size:12px;padding:18px;text-align:center;background:#f8f9fc;border-radius:7px}
.jcard{background:#fff;border:1px solid #e0e0e0;border-radius:9px;padding:11px 13px;margin-bottom:7px}
.jcard:hover{box-shadow:0 2px 9px rgba(0,0,0,.07)}
.jres{border-left:4px solid #00796b}.jcom{border-left:4px solid #2563a8}
.npill{font-size:10px;padding:2px 6px;border-radius:20px;border:1.5px solid #e0e0e0;background:#fff;color:#666;cursor:pointer;font-family:inherit}
.npill.on{background:#e8f0fb;border-color:#2563a8;color:#2563a8;font-weight:600}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.calh{text-align:center;font-size:9px;font-weight:600;color:#888;padding:2px 0}
.cald{min-height:55px;border:1px solid #e0e0e0;border-radius:3px;padding:2px;background:#fff;cursor:pointer}
.cald:hover{border-color:#2563a8}.cald.ctd{border-color:#2563a8;background:#e8f0fb}
.cald.cbl{background:#f8f9fc;opacity:.35;cursor:default}
.cev{font-size:7px;padding:1px 2px;border-radius:2px;margin-bottom:1px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
/* TOAST */
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(12px);background:#1a3a6b;color:#fff;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:500;box-shadow:0 3px 14px rgba(0,0,0,.25);z-index:999;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;max-width:84vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.tg{background:#2e7d32}.toast.tr{background:#c62828}
@media(max-width:768px){.g2,.g3,.g4,.r2{grid-template-columns:1fr}.adnav{min-width:120px}}
</style>
</head>

function buildLogin(){
  var g=document.getElementById("lgrid");g.innerHTML="";
  ["1","2","3","4","5","6","7","8","9","<","0","OK"].forEach(function(k){
    var b=el("button","lk"+(k==="OK"?" ok":""),k);
    b.onclick=(function(key){return function(){pressPin(key);};})(k);
    g.appendChild(b);
  });
  document.getElementById("fL").onclick=showForgot;
  document.getElementById("fBtnBack").onclick=hideForgot;
  document.getElementById("fBtnSend").onclick=sendReset;
  document.getElementById("btnOut").onclick=doLogout;
}

function pressPin(k){
  if(k==="<"){pin=pin.slice(0,-1);updDots();return;}
  if(k==="OK"){doLogin();return;}
  if(pin.length>=4)return;
  pin+=k;updDots();
  if(pin.length===4)setTimeout(doLogin,250);
}

function updDots(){
  for(var i=0;i<4;i++)document.getElementById("d"+i).className="dot"+(i<pin.length?" on":"");
}

function doLogin(){
  var u=null;
  for(var i=0;i<USERS.length;i++){if(USERS[i].pin===pin){u=USERS[i];break;}}
  if(!u){
    var le=document.getElementById("lerr");le.style.display="block";
    pin="";updDots();
    setTimeout(function(){le.style.display="none";},2500);
    return;
  }
  CU=u;
  AUDIT.unshift({dt:ts(),u:CU.name,a:"Logged in"});
  document.getElementById("pgL").style.display="none";
  document.getElementById("pgA").style.display="flex";
  document.getElementById("uAv").textContent=CU.init;
  if(isPM()){jPF=CU.init;scPm=CU.init;}
  buildNav();
  goTo(isSteveFn()?"sStCal":isField()?"sFi":"sD");
}

function doLogout(){
  CU=null;pin="";updDots();
  document.getElementById("pgA").style.display="none";
  document.getElementById("pgL").style.display="flex";
  document.getElementById("fF").style.display="none";
  document.getElementById("fL").style.display="block";
  document.getElementById("lgrid").style.display="grid";
  var fb=document.getElementById("fbBtn");if(fb)fb.remove();
  var fm=document.getElementById("fbModal");if(fm)fm.remove();
}

  document.getElementById("fL").style.display="none";

  document.getElementById("fF").style.display="block";
}

function buildAlerts(){
  var als=[];
  var myJ=isPM()?JOBS.filter(function(j){return j.pm===CU.init;}):JOBS;
  myJ.forEach(function(j){
    ["hang","tape","sand"].forEach(function(ph){
      if(j.pd[ph]&&j.pd[ph].d&&!j.wk[ph])
        als.push({cat:"jobs",lv:"a",ic:"walk",ti:"Walk "+PH_LBL[ph]+" - "+j.name.substring(0,28),su:(j.pd[ph].sub||"sub")+" completed",jid:j.id});
    });
    if(j.pd.sand&&j.pd.sand.d&&!j.wk.sand)
      als.push({cat:"billing",lv:"r",ic:"$",ti:"BILLING: Sand done - "+j.name.substring(0,26),su:"Invoice QB + pay "+(j.pd.sand.sub||"sub"),jid:j.id});
    if(j.pd.walk&&j.pd.walk.d&&!j.pd.inv.d)
      als.push({cat:"billing",lv:"a",ic:"QB",ti:"Invoice not created - "+j.name.substring(0,26),su:"Job walked - open QB",jid:j.id});
    phKs(j).forEach(function(ph){
      if(ph==="load"||ph==="walk"||ph==="inv")return;
      var p=j.pd[ph];
      if(p.d&&j.wk[ph]&&!j.pd2[ph]&&p.sub)
        als.push({cat:"billing",lv:"r",ic:"$",ti:"PAY: "+p.sub+" - "+PH_LBL[ph]+" - "+j.name.substring(0,20),su:"Phase walked - add to payroll",jid:j.id});
    });
  });
  if(isAdmin()){
    BIDS.forEach(function(b){
      if(b.status==="lost"||b.status==="awarded")return;
      if(!b.due)return;
      var diff=Math.round((new Date(b.due)-new Date())/86400000);
      if(!b.sub&&diff<=3&&diff>=0)als.push({cat:"bids",lv:"r",ic:"!",ti:"Bid due in "+diff+"d - "+b.name,su:"Est: "+(b.est||"Unassigned")+" - Due: "+b.due,bid:b.id});
      if(b.sub&&b.status==="submitted"&&!b.fu1)als.push({cat:"bids",lv:"a",ic:"FU",ti:"Follow up needed - "+b.name,su:"Submitted "+b.sd,bid:b.id});
    });
  }
  PIN_REQS.forEach(function(r){if(r.status==="pending")als.push({cat:"admin",lv:"a",ic:"PIN",ti:"PIN reset - "+r.name,su:r.dt});});
  TMS.forEach(function(t){if(t.status==="pending")als.push({cat:"billing",lv:"a",ic:"T&M",ti:"T&M pending - "+t.job,su:t.sub+" - "+t.hrs+"h"});});
  return als;
}

var steveCurrent=null;
function steveClock(){
  if(!fClock){
    // Clock IN
    var jid=getV("stJ");
    if(!jid){toast("Select a job first","r");return;}
    var j=fJ(parseInt(jid));
    var notes=getV("stNotes");
    var wt=steveWorkType;
    var wtLabel={"contract":"Contract","tm":"T&M","co_approved":"CO / Approved","co_pending":"CO / Pending"};
    steveCurrent={id:Date.now(),jid:parseInt(jid),jobName:j?j.name:"Unknown",workType:wtLabel[wt]||wt,date:new Date().toLocaleDateString(),clockIn:new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}),clockInMs:Date.now(),clockOut:null,hours:null,notes:notes};
    STEVE_LOG.push(steveCurrent);
    fClock=true;
    if(j)aLog(parseInt(jid),"Steve clocked IN — "+wtLabel[wt]);
    toast("Clocked in to: "+steveCurrent.jobName,"g");
    rField();
  } else {
    // Clock OUT
    if(!steveCurrent){fClock=false;rField();return;}
    steveCurrent.clockOut=new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
    var elapsed=((Date.now()-steveCurrent.clockInMs)/3600000).toFixed(2);
    steveCurrent.hours=elapsed;
    var j=fJ(steveCurrent.jid);
    if(j)aLog(steveCurrent.jid,"Steve clocked OUT — "+steveCurrent.workType+" — "+elapsed+"h");
    // If T&M, create a TM entry for billing (no amounts shown to Steve)
    if(steveCurrent.workType==="T&M"){
      TMS.push({id:Date.now(),job:steveCurrent.jobName,jid:""+steveCurrent.jid,sub:"Steve Little",hrs:elapsed,rate:"",total:"",desc:"T&M — "+steveCurrent.notes,dt:ts(),status:"pending",by:"Steve Little"});
    }
    fClock=false;steveCurrent=null;
    toast("Clocked out — "+elapsed+"h logged","g");
    rField();
  }
}

// ── SHARED: build event objects for a date ───────────────────
function getEvtsForDate(y,m,d){
  var evts=[];
  // Phase-based assignments from JOBS
  JOBS.forEach(function(j){
    Object.keys(j.pd).filter(function(ph){return ph.indexOf("spot")===0&&j.pd[ph].sub==="Steve Little";}).forEach(function(ph){
      var pd=j.pd[ph];if(!pd.dt)return;
      var pts=pd.dt.match(/(\d{1,2})[\/\-](\d{1,2})/);if(!pts)return;
      if(parseInt(pts[1])-1!==m||parseInt(pts[2])!==d)return;
      evts.push({type:"job",jid:j.id,job:j,ph:ph,pd:pd,
        label:PH_LBL[ph]+": "+j.name,
        addr:j.addr||"",gc:j.gc||"",con:j.con||"",phone:j.ph||"",
        assignedBy:pd.assignedBy||"",notes:pd.no||"",done:pd.d});
    });
  });
  // Scheduled events from BuilderTrend import
  STEVE_SCHEDULE_DATA.forEach(function(e){
    var p=e.date.split("/");if(p.length<3)return;
    if(parseInt(p[0])-1!==m||parseInt(p[1])!==d||parseInt(p[2])!==y)return;
    evts.push({type:"scheduled",label:e.jobName,
      task:e.jobName,workType:e.workType,clockIn:e.clockIn,clockOut:e.clockOut,
      hours:e.hours,notes:e.notes,addr:extractAddr(e.jobName),done:false,isBT:true});
  });
  // Clocked time log entries
  STEVE_LOG.forEach(function(e){
    if(!e.clockOut)return;
    var p=e.date.split("/");if(p.length<3)return;
    if(parseInt(p[0])-1!==m||parseInt(p[1])!==d||parseInt(p[2])!==y)return;
    evts.push({type:"log",label:e.hours+"h - "+e.workType+": "+e.jobName,
      workType:e.workType,hours:e.hours,notes:e.notes,
      clockIn:e.clockIn,clockOut:e.clockOut,jobName:e.jobName});
  });
  // Sort by start time
  evts.sort(function(a,b){
    var ta=a.clockIn||"";var tb=b.clockIn||"";
    return ta.localeCompare(tb);
  });
  return evts;
}

function extractAddr(jobName){
  // Pull the address part after the dash from "Task - Address" format
  var parts=jobName.split(" - ");
  return parts.length>1?parts[parts.length-1].replace(/\s*26-\d+$/,"").trim():"";
}

  var res=el("div","srch-results");
  var existing=s.querySelector(".srch-results");if(existing)existing.remove();

  var hits=[];
  JOBS.forEach(function(j){
    var fields=[j.name,j.gc||"",j.con||"",j.scope||"",j.notes||"",j.lb||"",j.pm||""];

    if(match||phMatch.length||logMatch.length)hits.push({j:j,phMatch:phMatch,logMatch:logMatch});
  });

  var hdr=el("div");hdr.style.cssText="font-size:11px;color:#888;margin-bottom:9px";

    var pn=el("span");pn.style.cssText="font-size:11px;font-weight:700;color:#2563a8";pn.textContent=p+"%";top.appendChild(pn);
    card2.appendChild(top);

    var det=el("div");det.style.cssText="font-size:10px;color:#888;margin-bottom:6px";
    det.textContent=(j.gc||"—")+" • PM: "+j.pm+" • "+j.scope;card2.appendChild(det);

    if(j.lb){var lb=el("div");lb.style.cssText="font-size:11px;color:#00695c;margin-bottom:4px";lb.textContent="🔒 "+j.lb;card2.appendChild(lb);}
    if(j.notes){var no=el("div");no.style.cssText="font-size:11px;color:#e65100;margin-bottom:4px";no.textContent="📌 "+j.notes;card2.appendChild(no);}

      pm.appendChild(pml);pm.appendChild(document.createTextNode(hit.phMatch.join(", ")));card2.appendChild(pm);
    }

    if(hit.logMatch.length){
      var lm=el("div");lm.style.cssText="font-size:10px;border-top:1px solid #f5f5f5;padding-top:5px;margin-top:4px";
      lm.appendChild(el("div","","Log matches:")).style.cssText="font-weight:600;color:#888;margin-bottom:3px";
      hit.logMatch.slice(0,3).forEach(function(lg){
        var lr=el("div");lr.style.cssText="font-size:10px;color:#555;padding:2px 0;border-bottom:1px solid #f9f9f9";

    }
    res.appendChild(card2);

}

    ss.forEach(function(step,i){var d=el("div","hts");var n=el("div","htn",""+(i+1));var t=el("div");t.style.cssText="font-size:12px;line-height:1.6";t.textContent=step;d.appendChild(n);d.appendChild(t);bd.appendChild(d);});
    var prog=tProg[m.id]||0;
    var cb=btn("Mark Complete","btn bg",function(){tProg[m.id]=100;AUDIT.unshift({dt:ts(),u:CU?CU.name:"",a:"Training completed: "+m.t});closeOV();rAdmin();toast("Module complete!","g");});
    bd.appendChild(cb);
    if(prog>0){var psp=el("span");psp.style.cssText="font-size:10px;color:#888;margin-left:9px";psp.textContent=prog+"% complete";bd.appendChild(psp);}
    ob.appendChild(bd);
  });
}

var HOWTOS=[{t:"Setting up a new job",steps:["Click Active Jobs → + Add Job","Fill in job name, GC, contact, phone, lockbox, type (res/com)","Choose PM, supplier, and scope","Add footage and contract amount","Click Add to Production","Click each phase dot to assign subs and set dates"]},{t:"Assigning a sub to a phase",steps:["Find the job in Active Jobs","Click the phase dot or phase chip","Select sub from dropdown","Choose pay type and enter rate (total calculates automatically)","Set the scheduled date","Click Save — sub is notified immediately"]},{t:"Tracking a phase from done to paid",steps:["Sub marks phase complete from their phone — PM and Haley notified","PM physically walks the site","In Active Jobs, click Walk on the completed phase","Walking queues sub payment and notifies Controller","Go to Billing → Sub Payroll to see the trigger","Add sub to payroll, then click Mark Paid to close the trigger"]},{t:"Working the bid board",steps:["Click Bids in the navigation","Active Bids shows all current bids — click any row for full details","To mark submitted: click Submit button","To log a follow up: click FU1 or FU2","If awarded: click Award — auto-creates the job","If lost: click Lost — moves to Lost tab"]},{t:"Resetting a PIN",steps:["User taps Forgot PIN on login screen","They enter name and reason — request sent to Kerry and Kaylee","Log into Admin Portal → PIN Requests","Find the request and click Approve & Send PIN","New temp PIN is generated — share it securely with the user"]},{t:"Managing subs",steps:["Go to Subs & Staff tab","Click any sub to view profile, current jobs, quality rating","To add: click + Add and fill in name, trade, pay type","To change status: Set Active / Inactive / Do Not Use","Quality rating: click the star rating (1-5)"]}];

function admHowTo(c){
  var card=el("div","card");card.appendChild(el("div","ct","How-To Guides"));
  card.appendChild(notice("Step-by-step instructions for common tasks."));
  HOWTOS.forEach(function(guide,i){
    var wrap=el("div","hti");
    var hdr=el("div","hth",guide.t);var icon=el("span","+");hdr.appendChild(icon);
    var body=el("div","htb");body.id="hg"+i;
    guide.steps.forEach(function(step,k){
      var d=el("div","hts");d.appendChild(el("div","htn",""+(k+1)));
      var t=el("div");t.style.lineHeight="1.6";t.textContent=step;d.appendChild(t);body.appendChild(d);

}

function admExport(c){
  var EXPORTS=[{t:"Active Jobs",d:"All jobs with GC, PM, phase status",fn:function(){exportCSV([["ID","Name","GC","Contact","Phone","Type","PM","Supplier","Scope","SF","Contract","Lockbox","Notes"]].concat(JOBS.map(function(j){return[j.id,j.name,j.gc,j.con,j.ph,j.type,j.pm,j.sup||"",j.scope,j.ft,j.ct,j.lb,j.notes];})),"NCP_Jobs");}},{t:"Bids & Leads",d:"Full bid board with status and amounts",fn:function(){exportCSV([["ID","Name","GC","Status","Quoted","Due","Submitted","Estimator","Scope"]].concat(BIDS.map(function(b){return[b.id,b.name,b.gc,b.status,b.q,b.due,b.sub?"Yes":"No",b.est,b.scope];})),"NCP_Bids");}},{t:"Sub Roster",d:"All subs with status, trade, pay type",fn:function(){exportCSV([["ID","Name","Type","Trade","Phone","Pay","Status","Quality","Notes"]].concat(SUBS.map(function(s){return[s.id,s.name,s.type,s.trade,s.ph,s.pay,s.status,s.q,s.notes];})),"NCP_Subs");}},{t:"T&M Log",d:"All T&M entries with approval status",fn:function(){exportCSV([["ID","Job","Sub","Hours","Rate","Total","Description","Date","Status"]].concat(TMS.map(function(t){return[t.id,t.job,t.sub,t.hrs,t.rate,t.total,t.desc,t.dt,t.status];})),"NCP_TM");}},{t:"Audit Log",d:"Complete log of every action taken",fn:function(){exportCSV([["Date","User","Action"]].concat(AUDIT.map(function(a){return[a.dt,a.u,a.a];})),"NCP_Audit");}}];
  var card=el("div","card");card.appendChild(el("div","ct","Export Data"));
  card.appendChild(notice("Export any data set to CSV — opens in Excel."));
  var g=el("div","g2");
  EXPORTS.forEach(function(exp){
    var d=el("div");d.style.cssText="background:#f8f9fc;border:1px solid #e0e0e0;border-radius:8px;padding:12px";
    d.appendChild(el("div","",""+exp.t)).style.cssText="font-size:12px;font-weight:600;margin-bottom:2px";
    d.appendChild(el("div","",""+exp.d)).style.cssText="font-size:10px;color:#888;margin-bottom:8px";
    d.appendChild(btn("Export CSV","btn bs",exp.fn));g.appendChild(d);
  });
  card.appendChild(g);c.appendChild(card);
}

function exportCSV(rows,name){
  var csv="";
  rows.forEach(function(row){csv+=row.map(function(v){return '"'+String(v||"").replace(/"/g,'""')+'"';}).join(",")+"\n";});
  var blob=new Blob([csv],{type:"text/csv"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");a.href=url;a.download=name+"_"+new Date().toISOString().split("T")[0]+".csv";a.click();
  toast(name+" exported","g");
}
